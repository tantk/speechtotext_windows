[package]
name = "whisper-ct2"
version.workspace = true
edition.workspace = true
description = "CTranslate2-based Whisper backend for app"

[lib]
crate-type = ["cdylib"]

[dependencies]
app-core = { path = "../../app-core" }
ct2rs = { version = "0.9", features = ["all-tokenizers"], default-features = false }
mel_spec = "0.3"
ndarray = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
cuda = ["ct2rs/cuda", "ct2rs/cudnn", "ct2rs/cuda-dynamic-loading"]
